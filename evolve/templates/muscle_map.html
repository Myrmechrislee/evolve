{% macro region(key, path, mirror=false) %}
{% set group = muscles.by_key[key] %}
<g class="muscle-region" data-muscle-region="{{ key }}" data-activity="{{ group.activity }}" role="button" tabindex="0" aria-controls="muscle-stats-{{ key }}" aria-pressed="{{ 'true' if muscles.active == key else 'false' }}" aria-label="{{ tr('{v0}: {v1} sets', v0=tr(group.label), v1=group.sets) }}">
  <title>{{ tr('{v0}: {v1} sets', v0=tr(group.label), v1=group.sets) }}</title>
  <path d="{{ path }}"/>{% if mirror %}<path d="{{ path }}" transform="translate(220 0) scale(-1 1)"/>{% endif %}
</g>
{% endmacro %}
